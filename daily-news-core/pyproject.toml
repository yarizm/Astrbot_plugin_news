[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daily-news-core"
version = "0.5.0"
description = "Core library for multi-source news aggregation with RSS, Atom, and DailyHot support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "YARIZM", email = "yarizm@example.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/yarizm/Astrbot_plugin_news"
Repository = "https://github.com/yarizm/Astrbot_plugin_news"
Issues = "https://github.com/yarizm/Astrbot_plugin_news/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/daily_news_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
